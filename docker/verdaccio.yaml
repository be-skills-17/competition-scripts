services:
  # This container starts first, fixes all folder permissions, and exits.
  verdaccio-init:
    image: alpine:latest
    container_name: "verdaccio-init"
    # Mount the exact same volumes as Verdaccio
    volumes:
      - "${DATA_DIR}/verdaccio:/verdaccio/storage"
      - "${CONFIG_DIR}/verdaccio:/verdaccio/conf"
    # Ensure folders exist, then force ownership to UID 10001 (Verdaccio's user)
    command: >
      sh -c "mkdir -p /verdaccio/storage /verdaccio/conf && 
             chown -R 10001:10001 /verdaccio/storage /verdaccio/conf && 
             chmod -R 755 /verdaccio/storage /verdaccio/conf"
  verdaccio:
    image: verdaccio/verdaccio
    container_name: "verdaccio"
    labels:
      traefik.enable: "true"
      traefik.http.routers.verdaccio.rule: HostRegexp(`{_:verdaccio\..*}`)
      traefik.http.services.verdaccio.loadbalancer.server.port: 4873
    environment:
      - VERDACCIO_PORT=4873
    ports:
      - "4873:4873"
    volumes:
      - "${DATA_DIR}/verdaccio:/verdaccio/storage"
      - "${CONFIG_DIR}/verdaccio:/verdaccio/conf"
    restart: always
    networks:
      - gitea
networks:
  gitea:
    external: true
