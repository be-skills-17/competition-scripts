      <<: *runner_env
      GITEA_RUNNER_NAME: "Runner 5"
    restart: always
    volumes:
      - "${CONFIG_DIR}/gitea-runner/config.yaml:/config.yaml"
      - /var/run/docker.sock:/var/run/docker.sock
      - "${DATA_DIR}/runner5:/data"
  runner6:
    <<: *runner
    environment:
      <<: *runner_env
      GITEA_RUNNER_NAME: "Runner 6"
    restart: always
    volumes:
      - "${CONFIG_DIR}/gitea-runner/config.yaml:/config.yaml"
      - /var/run/docker.sock:/var/run/docker.sock
      - "${DATA_DIR}/runner6:/data"

networks:
  gitea:
    external: true
