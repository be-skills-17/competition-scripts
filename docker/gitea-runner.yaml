services:
  runner1: &runner
    image: gitea/act_runner:latest
    networks:
      - gitea
    environment: &runner_env
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: "http://gitea:3000"
      GITEA_RUNNER_REGISTRATION_TOKEN: "${REGISTRATION_TOKEN}"
      GITEA_RUNNER_NAME: "Runner 1"
    restart: always
    volumes:
      - "${CONFIG_DIR}/gitea-runner/config.yaml:/config.yaml"
      - /var/run/docker.sock:/var/run/docker.sock
      - "${DATA_DIR}/runner1:/data"
  runner2:
    <<: *runner
    environment:
      <<: *runner_env
      GITEA_RUNNER_NAME: "Runner 2"
    restart: always
    volumes:
      - "${CONFIG_DIR}/gitea-runner/config.yaml:/config.yaml"
      - /var/run/docker.sock:/var/run/docker.sock
      - "${DATA_DIR}/runner2:/data"
  runner3:
    <<: *runner
    environment:
      <<: *runner_env
      GITEA_RUNNER_NAME: "Runner 3"
    restart: always
    volumes:
      - "${CONFIG_DIR}/gitea-runner/config.yaml:/config.yaml"
      - /var/run/docker.sock:/var/run/docker.sock
      - "${DATA_DIR}/runner3:/data"
  runner4:
    <<: *runner
    environment:
      <<: *runner_env
      GITEA_RUNNER_NAME: "Runner 4"
    restart: always
    volumes:
      - "${CONFIG_DIR}/gitea-runner/config.yaml:/config.yaml"
      - /var/run/docker.sock:/var/run/docker.sock
      - "${DATA_DIR}/runner4:/data"
  runner5:
    <<: *runner
