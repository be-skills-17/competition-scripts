services:
  traefik:
    image: traefik:v3.6.2
    container_name: traefik
    restart: unless-stopped
    networks:
      - gitea
      - default
    command:
      - "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:${REGISTRY_PORT}"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.forwardedHeaders.trustedIPs=0.0.0.0/0"
      - "--entrypoints.websecure.proxyProtocol.trustedIPs=0.0.0.0/0"
      - "--providers.docker.defaultRule=HostRegexp(`{host:.+}`)"
      - "--serversTransport.insecureSkipVerify=true"
    ports:
      - "80:80"
      - "443:443"
      - "5000:5000"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "${CONFIG_DIR}/letsencrypt:/letsencrypt"
      - "${CONFIG_DIR}/traefik/config.yaml:/etc/traefik/dynamic/traefik.yaml"
      - "${CONFIG_DIR}/traefik/certs:/etc/certs/"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`${GITEA_HOSTNAME}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"
      - traefik.http.middlewares.cors-home.headers.accessControlAllowOriginList=null
      - traefik.http.middlewares.cors-home.headers.accessControlAllowMethods=GET
      - traefik.http.routers.traefik.middlewares=cors-home   # à ajouter à la liste existante s'il y en a 

networks:
  gitea:
    name: gitea
    driver: bridge
