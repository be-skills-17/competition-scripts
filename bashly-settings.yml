# Bashly settings, see https://bashly.dev/usage/settings/
# Regenerate competition.sh after any change in src/:
#   docker run --rm --user $(id -u):$(id -g) -v "$PWD:/app" dannyben/bashly:2.0.0 generate
source_dir: src
target_dir: .
env: production
# No "set -e" in the generated script (bashly adds it by default, even with strict: false): the code is written to
# handle errors itself, and a harmless failure (e.g. an image that can't be removed) must not stop a command midway
strict: ""
