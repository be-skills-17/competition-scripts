name: competition.sh
help: Set up and manage a web development competition environment (Gitea, Traefik, MySQL, Verdaccio, WUD)
version: 2.0.0
footer: Every command must be run as root (sudo).

flags:
- long: --verbose
  short: -v
  help: Show debug output and the output of every underlying command

commands:
- name: setup
  help: Install system dependencies (Docker, jq, git, curl, certbot...)
  filters: [root]

- name: check-config
  help: Check config/main.json and list every problem, without changing anything
  filters: [root]
  dependencies: [jq]

- name: init
  help: Initialize the environment from config/main.json and start every service
  filters: [root, not_initialized, valid_config]
  dependencies: [docker, jq, curl, git]

- name: start
  help: Start all services
  filters: [root, initialized]
  dependencies: [docker]

- name: stop
  help: Stop all services, keeping their containers and data
  filters: [root, initialized]
  dependencies: [docker]

- name: recreate
  help: Recreate some services without touching the rest of the stack
  filters: [root, initialized]
  dependencies: [docker, jq]
  args:
  - name: service
    repeatable: true
    help: |-
      Service name (e.g. gitea, verdaccio, comp01_module-a) or group name (traefik, gitea, runners, mysql, verdaccio, wud, competitors).
      An exact service name wins over a group name. Run without arguments to list them.
  examples:
  - sudo ./competition.sh recreate
  - sudo ./competition.sh recreate gitea
  - sudo ./competition.sh recreate verdaccio wud
  - sudo ./competition.sh recreate runners

- name: import-frameworks
  help: Re-import the frameworks templates into Gitea and cache their npm dependencies (after changing allowed_frameworks or the frameworks repository)
  filters: [root, initialized, valid_config]
  dependencies: [docker, jq, curl, git]

- name: prefetch-npm
  help: Cache the npm dependencies of every framework template in Verdaccio, then cut npmjs off (also done by init)
  filters: [root, initialized]
  dependencies: [docker, jq, curl]
  flags:
  - long: --keep-online
    help: Leave the npm proxy on after downloading (any package stays installable)

- name: npm-proxy
  help: Turn Verdaccio's npm proxy on (any package) or off (cached packages only); without argument, show it
  filters: [root, initialized]
  dependencies: [docker, curl]
  args:
  - name: mode
    allowed: ["on", "off"]
    help: on or off
  examples:
  - sudo ./competition.sh npm-proxy
  - sudo ./competition.sh npm-proxy on

- name: deploy-apis
  help: Deploy the enabled APIs of config/apis/ for every competitor (after adding, changing or disabling one)
  filters: [root, initialized, valid_config]
  dependencies: [docker, jq]

- name: reset-api
  help: Replace a competitor's API database by the initial SQLite database of the API
  filters: [root, initialized, valid_config]
  dependencies: [docker, jq]
  args:
  - name: api
    required: true
    help: API name (the "name" of its api.json)
  - name: competitor
    help: Competitor username. All competitors when omitted.
  examples:
  - sudo ./competition.sh reset-api products-api comp01
  - sudo ./competition.sh reset-api products-api

- name: backup
  help: Back up data, config and .env into backups/ (services are stopped during the copy)
  filters: [root, initialized]
  dependencies: [docker]

- name: restore
  help: Replace the current environment with a backup (the current one is backed up first)
  filters: [root]
  dependencies: [docker, jq]
  args:
  - name: backup
    help: Backup file, file name in backups/, or "latest". Run without arguments to list backups.
  examples:
  - sudo ./competition.sh restore latest
  - sudo ./competition.sh restore backup-20261016-191708-manual.tar.gz

- name: clean
  help: Remove every container, data, generated file and competitor image (a backup is made first)
  filters: [root]
  dependencies: [docker, jq]
  flags:
  - long: --no-backup
    help: Do not back up before cleaning
