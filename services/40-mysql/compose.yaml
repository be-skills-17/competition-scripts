services:
  competitor_db:
    image: mysql:8.4.6
    restart: always
    networks:
      - default
      - competitors-db
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - "${DATA_DIR}/mysql-competition:/var/lib/mysql"
      - "${CONFIG_DIR}/mysql/competitors.sql:/docker-entrypoint-initdb.d/1.sql"
    labels:
      traefik.enable: "true"
      traefik.http.routers.competitor-db.rule: Host(`db.${DOMAIN}`)
      traefik.http.services.competitor-db.loadbalancer.server.port: 3306
      wud.watch: false
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.3
    networks:
      - default
    depends_on:
      - competitor_db
    environment:
      PMA_HOST: "competitor_db"
      PMA_PORT: 3306
    restart: always
    labels:
      traefik.enable: "true"
      traefik.http.routers.pma.rule: Host(`pma.${DOMAIN}`)
      traefik.http.services.pma.loadbalancer.server.port: 80
      traefik.http.routers.pma.tls: true
      traefik.http.routers.pma.entrypoints: websecure

# Competitor containers reach MySQL as competitor_db on this network (services/70-competitors/lib/competitors.sh),
# without being on the default network of phpMyAdmin
networks:
  competitors-db:
    name: competitors-db
