services:
  whatsupdocker:
    image: getwud/wud:9.4.1
    container_name: wud
    restart: unless-stopped
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0

      # Authentication (mandatory since the latest major version)
      - WUD_AUTH_ADMIN_USER=${USERNAME}
      - WUD_AUTH_ADMIN_PASSWORD=${PASSWORD}

      # Gitea's registry, declared as a "custom" registry on purpose: WUD's "gitea" provider asks a new registry
      # token for every request, the custom one caches it (one per image, 60 s). The password is a Gitea token,
      # in env_file below (see lib/wud.sh). Containers are matched by their image's registry URL.
      - WUD_REGISTRY_CUSTOM_GITEA_URL=${GITEA_URL}
      - WUD_REGISTRY_CUSTOM_GITEA_LOGIN=${USERNAME}

      - WUD_WATCHER_LOCAL_WATCHBYDEFAULT=false
      - WUD_WATCHER_LOCAL_JITTER=1
      - WUD_WATCHER_LOCAL_CRON=*/10 * * * * *
      - WUD_LOG_LEVEL=DEBUG

      - WUD_TRIGGER_DOCKER_DEPLOY_PRUNE=true

      - WUD_REGISTRY_HUB_PUBLIC_ENABLED=false
      - WUD_REGISTRY_ECR_PUBLIC_ENABLED=false
      - WUD_REGISTRY_GCR_PUBLIC_ENABLED=false
      - WUD_REGISTRY_GHCR_PUBLIC_ENABLED=false
      - WUD_REGISTRY_QUAY_PUBLIC_ENABLED=false
    # WUD_REGISTRY_CUSTOM_GITEA_PASSWORD: a read:package token, written by the pre_up hook. Not required: stop,
    # down... must work before the hook ever ran (an existing installation, until "recreate wud")
    env_file:
      - path: "${DYNAMIC_DIR}/wud/registry.env"
        required: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - "git.${DOMAIN}:172.17.0.1"
    ports:
      - 9000:3000
    networks:
      - gitea
      - default
    labels:
      traefik.enable: true
      traefik.http.routers.wud.rule: Host(`wud.${DOMAIN}`)
      traefik.http.routers.wud.entrypoints: websecure
      traefik.http.services.wud.loadbalancer.server.port: 3000
      traefik.http.routers.wud.tls: ${ENABLE_HTTPS}

networks:
  gitea:
    external: true