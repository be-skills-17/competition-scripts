services:
  traefik:
    image: traefik:v3.6.2
    container_name: traefik
    restart: unless-stopped
    networks:
      - gitea
      - default
    command:
      - "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Containers on several networks (modules: gitea + competitors-db) would otherwise be reached on a random one,
      # often competitors-db, which Traefik is not on: 504 Gateway Timeout
      - "--providers.docker.network=gitea"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:${REGISTRY_PORT}"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.forwardedHeaders.trustedIPs=0.0.0.0/0"
      - "--entrypoints.websecure.proxyProtocol.trustedIPs=0.0.0.0/0"
      - "--providers.docker.defaultRule=HostRegexp(`{host:.+}`)"
      - "--serversTransport.insecureSkipVerify=true"
    ports:
      - "80:80"
      - "443:443"
      - "5000:5000"
      # Traefik dashboard and API (entrypoint "traefik", api.insecure): server only, no public route.
      # http://localhost:8091/dashboard/ ; the organizer dashboard reaches it through the gitea network.
      - "127.0.0.1:8091:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "${CONFIG_DIR}/letsencrypt:/letsencrypt"
      - "${CONFIG_DIR}/traefik/config.yaml:/etc/traefik/dynamic/traefik.yaml"
      - "${CONFIG_DIR}/traefik/certs:/etc/certs/"

networks:
  gitea:
    name: gitea
    driver: bridge
