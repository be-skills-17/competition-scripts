services:
  verdaccio:
    image: verdaccio/verdaccio
    container_name: "verdaccio"
    labels:
      traefik.enable: "true"
      traefik.http.routers.verdaccio.rule: Host(`npm.${DOMAIN}`)
      traefik.http.routers.verdaccio.entrypoints: websecure
      traefik.http.routers.verdaccio.tls: "true"
      traefik.http.services.verdaccio.loadbalancer.server.port: 4873
    environment:
      - VERDACCIO_PORT=4873
      - VERDACCIO_PUBLIC_URL=https://npm.${DOMAIN}
    ports:
      - "4873:4873"
    volumes:
      - "${DATA_DIR}/verdaccio:/verdaccio/storage"
      - "${CONFIG_DIR}/verdaccio:/verdaccio/conf"
    restart: always
    networks:
      - gitea

networks:
  gitea:
    external: true