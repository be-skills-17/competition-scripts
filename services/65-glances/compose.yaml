# Glances: server metrics (CPU, memory, load, disk, containers) for the dashboard.
# API only (no web UI) and not routed by Traefik: only the dashboard reaches it, through the gitea network.
services:
  glances:
    image: nicolargo/glances:4.3.3
    container_name: glances
    restart: unless-stopped
    pid: host                       # sees the host's processes, not only the container's
    environment:
      # Only the plugins the dashboard reads (loadMetrics in services/80-dashboard/html/index.html): with all of
      # them (process list of the whole host, sensors, network...) Glances used more than one CPU core
      - GLANCES_OPT=-w --disable-webui --disable-plugin all --enable-plugin cpu,mem,load,fs,uptime,containers
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # per-container stats
    networks:
      - gitea
    labels:
      wud.watch: "false"

networks:
  gitea:
    external: true
