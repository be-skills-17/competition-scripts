server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS, resolved at request time: nginx starts even if traefik or glances are not up yet
    resolver 127.0.0.11 valid=30s;

    location /traefik/ {
        set $traefik http://traefik:8080;
        rewrite ^/traefik/(.*)$ /$1 break;
        proxy_pass $traefik;
    }

    location /glances/ {
        set $glances http://glances:61208;
        rewrite ^/glances/(.*)$ /$1 break;
        proxy_pass $glances;
    }

    # API documentation (api-docs.html): only the openapi.json of each API folder, never its code or database
    location ~ ^/apis/([A-Za-z0-9_-][A-Za-z0-9._-]*)/openapi\.json$ {
        alias /etc/nginx/apis/$1/openapi.json;
        add_header Cache-Control no-store;
    }

    # Generated from config/main.json (see service.sh)
    location = /config.js {
        alias /etc/nginx/dashboard/config.js;
        add_header Cache-Control no-store;
    }
}
