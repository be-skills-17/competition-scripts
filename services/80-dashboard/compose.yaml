# Organizer dashboard: competitors' modules, services and server metrics.
# Only reachable from the server itself (http://localhost:8090), never through Traefik.
# nginx proxies the Traefik API and Glances over the gitea network, so the page needs no CORS.
services:
  dashboard:
    image: nginx:1.28.0-alpine
    container_name: dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - "${SERVICES_DIR}/80-dashboard/html:/usr/share/nginx/html:ro"
      - "${SERVICES_DIR}/80-dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      # Outside html/: a mount can't be created inside a read-only mount
      - "${DYNAMIC_DASHBOARD_DIR}/config.js:/etc/nginx/dashboard/config.js:ro"
    networks:
      - gitea
    labels:
      wud.watch: "false"

networks:
  gitea:
    external: true
