<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Documentation des API — StarTech's Days</title>
<link rel="stylesheet" href="fonts/montserrat.css">
<link rel="stylesheet" href="swagger/swagger-ui.css">
<style>
body{margin:0;background:#fff}
.docs-bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:#1e3048;color:#fff;padding:14px 24px;font-family:Montserrat,system-ui,sans-serif}
.docs-bar h1{margin:0;font-size:18px;font-weight:800}
.docs-bar .back{color:#e6ae4f;font-weight:700;text-decoration:none}
.docs-bar .back:hover{text-decoration:underline}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:700 13px Montserrat,system-ui,sans-serif;border:0;border-radius:999px;padding:6px 14px;cursor:pointer;background:rgba(255,255,255,.12);color:#fff}
.tabs button:hover{background:rgba(255,255,255,.22)}
.tabs button[aria-current="true"]{background:#e6ae4f;color:#1e3048}
.docs-note{max-width:1460px;margin:16px auto 0;padding:0 20px;color:#6a7686;font:500 14px Montserrat,system-ui,sans-serif}
/* Documentation only: no server to call from here (each competitor has their own instance) */
.swagger-ui .scheme-container{display:none}
</style>
</head>
<body>
<header class="docs-bar">
  <a class="back" href="./">← Dashboard</a>
  <h1>Documentation des API</h1>
  <nav class="tabs" id="tabs" aria-label="API"></nav>
</header>
<p class="docs-note" id="note">Chargement…</p>
<div id="swagger"></div>

<!-- Generated by competition.sh: the enabled APIs (name, folder in config/apis/) -->
<script src="config.js"></script>
<script src="swagger/swagger-ui-bundle.js"></script>
<script>
// One tab per enabled API that has an openapi.json (served by nginx from config/apis/<folder>/, read live)
const tabs = document.getElementById('tabs');
const note = document.getElementById('note');

function show(tab) {
  tabs.querySelectorAll('button').forEach((other) => other.setAttribute('aria-current', String(other === tab)));
  history.replaceState(null, '', '#' + encodeURIComponent(tab.dataset.name));
  // No "Try it out" (documentation only); validatorUrl: null, or Swagger UI asks validator.swagger.io
  SwaggerUIBundle({ url: tab.dataset.spec, dom_id: '#swagger', validatorUrl: null, deepLinking: false, supportedSubmitMethods: [] });
}

Promise.all((window.DASHBOARD_CONFIG.apis || []).map(async (api) => {
  const spec = `apis/${encodeURIComponent(api.folder)}/openapi.json`;
  const response = await fetch(spec, { method: 'HEAD' }).catch(() => null);
  return response && response.ok ? { ...api, spec } : null;
})).then((apis) => {
  apis = apis.filter(Boolean);
  note.textContent = apis.length ? '' : 'Aucune API documentée (ajoutez un openapi.json dans le dossier de l\'API).';
  note.hidden = apis.length > 0;
  for (const api of apis) {
    const tab = Object.assign(document.createElement('button'), { type: 'button', textContent: api.name });
    Object.assign(tab.dataset, { name: api.name, spec: api.spec });
    tab.addEventListener('click', () => show(tab));
    tabs.append(tab);
  }
  const wanted = decodeURIComponent(location.hash.slice(1));
  const buttons = [...tabs.querySelectorAll('button')];
  if (buttons.length) show(buttons.find((tab) => tab.dataset.name === wanted) || buttons[0]);
});
</script>
</body>
</html>
