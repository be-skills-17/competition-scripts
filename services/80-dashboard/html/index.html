<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StarTech's Days</title>
<link rel="stylesheet" href="fonts/montserrat.css">
<style>
:root{
  --navy:#1e3048; --red:#d43049; --yellow:#e6ae4f;
  --bg:#eef1f4; --card:#fff; --mut:#6a7686; --bd:#dfe4ea;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font:15px/1.4 Montserrat,system-ui,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}

/* En-tête façon bannière */
header{position:relative;overflow:hidden}
.title{max-width:1100px;margin:0 auto;padding:48px 260px 0 16px}
.title h1{margin:0;font-weight:900;font-size:clamp(40px,7vw,72px);line-height:.95;letter-spacing:.01em;text-transform:uppercase}
.title p{margin:14px 0 0;color:var(--yellow);font-weight:500;font-size:clamp(15px,1.8vw,20px)}
/* Bloc logo collé au bord droit, bord gauche biseauté et arrondi */
.logo{position:absolute;top:0;right:0;padding:44px 48px 40px 106px;isolation:isolate}
.logo::before{content:'';position:absolute;inset:0 -80px 0 0;background:var(--navy);transform:skewX(22deg);transform-origin:top;border-radius:0 0 0 36px;z-index:-1}
.logo svg{display:block;width:150px;height:auto}

main{max-width:1100px;margin:0 auto;padding:12px 16px 56px}

/* Bandeaux de section : onglet jaune + bande marine, coupes biseautées comme la bannière */
.band{display:inline-flex;align-items:stretch;margin:40px 0 16px}
.band .n{position:relative;z-index:1;background:var(--yellow);color:var(--navy);font-weight:900;font-size:20px;padding:6px 26px 6px 18px;display:flex;align-items:center;border-radius:10px 0 0 10px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.band .l{background:var(--navy);color:#fff;font-weight:800;font-size:18px;padding:8px 36px 8px 26px;margin-left:-14px;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}

/* Compétiteurs */
.comp{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--bd)}
.comp .ch{background:var(--red);color:#fff;display:flex;align-items:baseline;gap:10px;padding:12px 18px}
.comp .num{font-weight:900;font-size:22px}
.comp .pfx{font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.04em}
.comp .mods{display:flex;gap:10px;padding:14px 18px;flex-wrap:wrap}
.mod{background:var(--navy);color:#fff;font-weight:700;border-radius:999px;padding:8px 16px;font-size:14px;transition:background .15s,color .15s}
.mod:hover{background:var(--yellow);color:var(--navy)}

/* Services */
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:center;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--yellow);transform:translateY(-2px)}
.card img{width:42px;height:42px;object-fit:contain;flex:none}
.card .t{font-weight:800}
.card .d{color:var(--mut);font-size:13px;margin-top:2px;font-weight:500}
.card .h{color:var(--mut);font:12px ui-monospace,monospace;margin-top:6px}

/* Serveur : tuiles de métriques */
.metric{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px 18px}
.metric .k{color:var(--mut);font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.metric .v{font-weight:900;font-size:30px;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.metric .s{color:var(--mut);font-size:13px;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums}
.meter{height:8px;background:#e5e9ef;border-radius:999px;margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--navy);border-radius:999px;transition:width .4s}
.meter i.warn{background:#fab219}
.meter i.crit{background:#d03b3b}
.badge{font-size:12px;font-weight:800;color:var(--navy);white-space:nowrap}
.tops{background:var(--card);border:1px solid var(--bd);border-radius:16px;margin-top:14px;overflow-x:auto}
.tops table{width:100%;border-collapse:collapse;font-size:14px}
.tops th{text-align:left;color:var(--mut);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:12px 18px;border-bottom:1px solid var(--bd)}
.tops td{padding:9px 18px;border-bottom:1px solid var(--bd);font-weight:600;font-variant-numeric:tabular-nums}
.tops tr:last-child td{border-bottom:0}
.tops .num{text-align:right;white-space:nowrap}
.tops caption{text-align:left;font-weight:800;padding:14px 18px 4px}

footer{max-width:1100px;margin:0 auto;padding:0 16px 32px;color:var(--mut);font-size:13px;font-weight:700}

@media (max-width:700px){
  .logo{padding:22px 20px 20px 28px}
  .logo svg{width:84px}
  .title{padding:28px 140px 0 16px}
}
</style>
</head>

const SERVICES = [
  ['DB compétiteurs', 'Base de données des compétiteurs', 'db', '/', 'mysql'],
  ['Gitea', 'Serveur Git', 'git', '/', 'gitea'],

const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
};

// Liste statique au format [{ num, prefix, modules: [{ label, url }] }] — utilisée si l'API ne répond pas
const moduleLabel = (m) => (/^module-?/i.test(m) ? 'Module ' + m.replace(/^module-?/i, '').toUpperCase() : m);
const staticCompetitors = () =>
  COMPETITORS.map(({ username, subdomain }) => ({
    num: username.replace(/^comp/, ''),
    prefix: subdomain,
    modules: MODULES.map((m) => ({ label: moduleLabel(m), url: `https://${subdomain}-${m}.${DOMAIN}/` })),
  }));

// Lit les routers Traefik et regroupe les compXX_<module>@docker par compétiteur
async function loadCompetitors() {
  const res = await fetch(TRAEFIK_API + '/http/routers?per_page=1000', { signal: AbortSignal.timeout(3000) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const byNum = new Map();
  for (const r of await res.json()) {
    const m = /^comp(\d+)_(.+)@docker$/.exec(r.name);
    const host = /\bHost\(`([^`]+)`/.exec(r.rule || '')?.[1];
    if (!m || !host) continue;
    const [, num, mod] = m;
    if (!byNum.has(num)) byNum.set(num, { num, prefix: host.split('.')[0].split('-')[0], modules: [] });
    byNum.get(num).modules.push({
      label: MODULES.includes(mod) ? moduleLabel(mod) : 'API ' + mod,
      url: `https://${host}/`,
    });
  }
  for (const c of byNum.values()) c.modules.sort((a, b) => a.label.localeCompare(b.label));
  return [...byNum.values()].sort((a, b) => Number(a.num) - Number(b.num));
}

function renderCompetitors(list) {
  document.getElementById('count').textContent = list.length;
  const comps = document.getElementById('comps');
  comps.replaceChildren();
  for (const { num, prefix, modules } of list) {
    const box = el('div', 'comp');
    const head = el('div', 'ch');
    head.append(el('span', 'num', num), el('span', 'pfx', prefix));
    const mods = el('div', 'mods');
    for (const { label, url } of modules) {
      const a = el('a', 'mod', label);
      a.href = url;
      mods.append(a);
    }
    box.append(head, mods);
    comps.append(box);
  }
}

// Affiche la liste statique tout de suite, puis la remplace par celle de Traefik
renderCompetitors(staticCompetitors());
loadCompetitors()
  .then((list) => {
    renderCompetitors(list);
    document.getElementById('source').textContent = 'Compétiteurs chargés depuis Traefik';
  })
  .catch((e) => {
    console.warn('API Traefik injoignable, liste statique utilisée :', e);
    document.getElementById('source').textContent = 'Traefik injoignable — liste statique';
  });

document.getElementById('scount').textContent = SERVICES.length;
const services = document.getElementById('services');
for (const [name, desc, sub, path, icon] of SERVICES) {
  const base = sub.startsWith('http') ? sub : `https://${sub ? sub + '.' : ''}${DOMAIN}`;
  const host = base.replace(/^https?:\/\//, '');
  const a = el('a', 'card');
  a.href = base + path;
  const img = el('img');
  img.src = ICONS[icon];
  img.alt = '';
  const txt = el('div');
  txt.append(el('div', 't', name), el('div', 'd', desc), el('div', 'h', host));
  a.append(img, txt);
  services.append(a);
}

// Documentation des API fournies (Swagger, servie par ce dashboard) : seulement si une API est activée
if ((CONFIG.apis || []).length) {
  const a = el('a', 'card');
  a.href = 'api-docs.html';
  const img = el('img');
  img.src = 'swagger/logo.svg';
  img.alt = '';
  const txt = el('div');
  txt.append(el('div', 't', 'Documentation des API'), el('div', 'd', 'Swagger des API fournies'), el('div', 'h', location.host + '/api-docs.html'));
  a.append(img, txt);
  services.append(a);
  document.getElementById('scount').textContent = SERVICES.length + 1;
}

// ---------- Serveur (Glances) ----------
const GB = 1024 ** 3;
const fmtGB = (b) => (b / GB).toFixed(1).replace('.', ',') + ' Go';
const fmtMB = (b) => Math.round(b / 1024 ** 2) + ' Mo';
const pct = (v) => Math.round(v) + ' %';

// Seuils : la couleur est toujours accompagnée d'un libellé
const level = (p) => (p >= 90 ? ['crit', '▲ critique'] : p >= 75 ? ['warn', '▲ élevé'] : ['', '']);

function tile(label, value, sub, meterPct) {
  const box = el('div', 'metric');
  const k = el('div', 'k');
  k.append(el('span', null, label));
  const v = el('div', 'v', value);
  box.append(k, v);
  if (sub) box.append(el('div', 's', sub));
  if (meterPct !== undefined) {
    const p = Math.max(0, Math.min(100, meterPct));
    const [cls, text] = level(p);
    if (text) k.append(el('span', 'badge', text));
    const m = el('div', 'meter');
    const fill = el('i', cls);
    fill.style.width = p + '%';
    m.append(fill);
    box.append(m);
  }
  return box;
}

const getJSON = (p) => fetch(GLANCES_API + p, { signal: AbortSignal.timeout(2500) }).then((r) => {
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
});

async function loadMetrics() {
  const [cpu, mem, load, fs, uptime, containers] = await Promise.all(
    ['/cpu', '/mem', '/load', '/fs', '/uptime', '/containers'].map(getJSON),
  );
  // Glances tourne dans un conteneur : le disque de l'hôte apparaît via les fichiers montés, on garde le plus grand
  const disk = fs.reduce((a, b) => (b.size > (a?.size ?? 0) ? b : a), null);
  const running = containers.filter((c) => c.status === 'running');

  document.getElementById('hcount').textContent = running.length;
  document.getElementById('metrics').replaceChildren(
    cpu.idle === 0 && cpu.total === 0
      ? tile('CPU', '–', 'première mesure…')
      : tile('CPU', pct(cpu.total), cpu.cpucore + ' cœurs', cpu.total),
    tile('Mémoire', pct(mem.percent), `${fmtGB(mem.used)} / ${fmtGB(mem.total)}`, mem.percent),
    tile('Disque', disk ? pct(disk.percent) : '–', disk ? `${fmtGB(disk.used)} / ${fmtGB(disk.size)}` : '', disk?.percent),
    tile('Charge (1 min)', load.min1.toFixed(2), `5 min ${load.min5.toFixed(2)} · 15 min ${load.min15.toFixed(2)}`,
      (load.min1 / load.cpucore) * 100),
    tile('Uptime', uptime, running.length + ' conteneurs actifs'),
  );

  const top = [...running].sort((a, b) => (b.cpu?.total ?? 0) - (a.cpu?.total ?? 0)).slice(0, 8);
  document.getElementById('tops').replaceChildren(...top.map((c) => {
    const tr = el('tr');
    tr.append(el('td', null, c.name), el('td', 'num', (c.cpu?.total ?? 0).toFixed(1).replace('.', ',') + ' %'),
      el('td', 'num', c.memory_usage ? fmtMB(c.memory_usage) : '–'));
    return tr;
  }));
  document.getElementById('msource').textContent = 'Métriques : Glances, ' + new Date().toLocaleTimeString('fr-BE');
}

function refreshMetrics() {
  loadMetrics().catch((e) => {
    console.warn('Glances injoignable :', e);
    document.getElementById('msource').textContent = 'Métriques : Glances injoignable';
  }).finally(() => setTimeout(refreshMetrics, 3000));
}
refreshMetrics();
